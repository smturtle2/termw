<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>termw</title>
  <link rel="stylesheet" href="/terminal.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--term-bg, #ffffff);
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: row;
    }
    #tabbar {
      flex-shrink: 0;
      width: 48px;
      display: flex;
      flex-direction: column;
      background: var(--term-bg, #ffffff);
      border-right: 1px solid rgba(128, 128, 128, 0.35);
      overflow: hidden;
    }
    #tab-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 4px;
      margin: 1px 6px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      color: var(--term-fg, #000000);
      opacity: 0.75;
      font-size: 13px;
      overflow: hidden;
    }
    .tab-item:hover { opacity: 1; background: rgba(128, 128, 128, 0.12); }
    .tab-item.active {
      opacity: 1;
      background: var(--term-fg, #000000);
      color: var(--term-bg, #ffffff);
    }
    .tab-label {
      flex: none;
      max-width: 13px;
      white-space: nowrap;
      overflow: hidden;
      transform: rotate(-90deg);
      transform-origin: center;
    }
    .tab-close {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 12px;
      line-height: 1;
      padding: 0 2px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.6;
    }
    .tab-close:hover { opacity: 1; }
    #tab-new {
      flex-shrink: 0;
      margin: 6px;
      padding: 6px;
      border: 1px dashed rgba(128, 128, 128, 0.5);
      border-radius: 6px;
      background: transparent;
      color: var(--term-fg, #000000);
      font-size: 16px;
      cursor: pointer;
      opacity: 0.7;
    }
    #tab-new:hover { opacity: 1; }
    #terminal {
      flex: 1;
      min-width: 0;
      width: auto;
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      border-radius: 0;
      box-shadow: none;
      --term-font-family: 'D2Coding', 'D2Coding ligature', 'Noto Sans Mono CJK KR', 'NanumGothicCoding', monospace;
      --term-font-size: 15px;
      --term-line-height: 1.2;
      --term-row-height: 18px;
    }
    #terminal.wterm {
      background: var(--term-bg, #ffffff);
    }
    @media (max-width: 768px) {
      #tabbar { width: 48px; }
      .tab-item { padding: 8px 4px; }
      .tab-close { display: none; }
      #terminal {
        padding: 4px;
        --term-font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="tab-list"></div>
    <button id="tab-new" aria-label="새 세션 탭" title="새 세션">+</button>
  </div>
  <div id="terminal" class="wterm" role="textbox" aria-label="Terminal" aria-multiline="true" aria-roledescription="terminal" tabindex="0"></div>
  <button id="theme-btn" aria-label="Theme settings" title="Theme">🎨</button>
  <dialog id="theme-dialog">
    <form method="dialog">
      <h3>Theme — terminal</h3>
      <p style="font-size:12px;color:#666;margin:0 0 8px">background/foreground만 저장, TUI는 OSC 11;? 휘도로 판단</p>
      <div style="display:flex;gap:12px;align-items:center;margin:8px 0">
        <label>Background <input type="color" id="theme-bg" value="#ffffff"></label>
        <label>Foreground <input type="color" id="theme-fg" value="#000000"></label>
      </div>
      <div style="margin:8px 0">
        <label>Preset
          <select id="theme-preset">
            <option value="">custom</option>
            <option value="light">light #ffffff/#000000</option>
            <option value="dark">dark #1e1e1e/#d4d4d4</option>
            <option value="solarized">solarized #002b36/#839496</option>
            <option value="monokai">monokai #272822/#f8f8f2</option>
          </select>
        </label>
      </div>
      <div id="theme-status" style="font-size:12px;color:#0a0;min-height:1em"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="button" id="theme-cancel">Cancel</button>
        <button type="button" id="theme-apply">Apply</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
  <style>
    #theme-btn{position:fixed;top:8px;right:8px;z-index:10;background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 8px;cursor:pointer;opacity:0.85}
    #theme-btn:hover{opacity:1}
    #theme-dialog{border:1px solid #ccc;border-radius:8px;padding:16px;max-width:360px}
    #theme-dialog::backdrop{background:rgba(0,0,0,0.3)}
  </style>
</body>
</html>
